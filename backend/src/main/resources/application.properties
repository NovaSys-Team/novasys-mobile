# ---------------------------------------------------------------------------
# NovaSys backend - local development configuration
# ---------------------------------------------------------------------------
spring.application.name=novasys-backend

# --- Server -----------------------------------------------------------------
server.port=8080

# --- H2 in-memory database (development only) -------------------------------
# DB_CLOSE_DELAY=-1 keeps the schema alive for the lifetime of the JVM, so the
# database is not dropped when the last connection is returned to the pool.
spring.datasource.url=jdbc:h2:mem:novasysdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Browser-based SQL console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA / Hibernate --------------------------------------------------------
# create-drop rebuilds the in-memory schema on every start, which is what we
# want while there is no persistent database and no migration tooling yet.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Actuator ---------------------------------------------------------------
# Only health and info are exposed; full details are fine in local development.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
